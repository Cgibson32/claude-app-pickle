name: AffirmationAlarm
options:
  bundleIdPrefix: com.affirmationalarm
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.10"
targets:
  AffirmationAlarm:
    type: application
    platform: iOS
    sources:
      - path: AffirmationAlarm
        excludes:
          - Resources
          - Assets.xcassets
          - Preview Content
          - "**/*.example"
          - Info.plist
    resources:
      - path: AffirmationAlarm/Assets.xcassets
    settings:
      GENERATE_INFOPLIST_FILE: true
      PRODUCT_BUNDLE_IDENTIFIER: com.affirmationalarm.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
