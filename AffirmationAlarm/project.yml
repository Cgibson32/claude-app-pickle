name: AffirmationAlarm
options:
  bundleIdPrefix: com.cgibson
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.10"
targets:
  AffirmationAlarm:
    type: application
    platform: iOS
    sources:
      - path: AffirmationAlarm
        excludes:
          - Preview Content
          - "**/*.example"
          - Info.generated.plist
    info:
      path: AffirmationAlarm/Info.generated.plist
      properties:
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Fonts/Sora-Regular.ttf
          - Fonts/Sora-Medium.ttf
          - Fonts/Sora-SemiBold.ttf
          - Fonts/Sora-Bold.ttf
          - Fonts/DMSans-Light.ttf
          - Fonts/DMSans-Regular.ttf
          - Fonts/DMSans-Medium.ttf
          - Fonts/DMSans-SemiBold.ttf
          - Fonts/DMSans-Bold.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cgibson.affirmationalarm
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: JLYXS97L8A
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
