name: AffirmationAlarm
options:
  bundleIdPrefix: com.affirmationalarm
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  SWIFT_VERSION: "5.10"
  GENERATE_INFOPLIST_FILE: false
  INFOPLIST_FILE: AffirmationAlarm/Info.plist
targets:
  AffirmationAlarm:
    type: application
    platform: iOS
    sources:
      - path: AffirmationAlarm
        excludes:
          - Resources
          - Assets.xcassets
          - Preview Content
          - "**/*.example"
    resources:
      - path: AffirmationAlarm/Resources
        excludes:
          - "*.example"
      - path: AffirmationAlarm/Assets.xcassets
    settings:
      INFOPLIST_FILE: AffirmationAlarm/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.affirmationalarm.app
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      INFOPLIST_KEY_UILaunchScreen_Generation: true
      CODE_SIGN_STYLE: Automatic
    entitlements:
      path: AffirmationAlarm/AffirmationAlarm.entitlements
