name: AffirmationAlarm
options:
  bundleIdPrefix: com.cgibson
  deploymentTarget:
    iOS: "17.0"
settings:
  SWIFT_VERSION: "5.10"
targets:
  AffirmationAlarm:
    type: application
    platform: iOS
    sources:
      - path: AffirmationAlarm
        excludes:
          - Resources
          - Assets.xcassets
          - Preview Content
          - "**/*.example"
          - "**/*.plist"
    resources:
      - path: AffirmationAlarm/Resources
        excludes:
          - "*.example"
      - path: AffirmationAlarm/Assets.xcassets
    info:
      path: AffirmationAlarm/Info.generated.plist
      properties:
        UIAppFonts:
          - Fonts/Sora-Regular.ttf
          - Fonts/Sora-Medium.ttf
          - Fonts/Sora-SemiBold.ttf
          - Fonts/Sora-Bold.ttf
          - Fonts/DMSans-Light.ttf
          - Fonts/DMSans-Regular.ttf
          - Fonts/DMSans-Medium.ttf
          - Fonts/DMSans-SemiBold.ttf
          - Fonts/DMSans-Bold.ttf
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cgibson.affirmationalarm
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_STYLE: Automatic
