name: AffirmationAlarm
options:
  bundleIdPrefix: com.cgibson
  deploymentTarget:
    # iOS 26.1 is required — `AlarmPresentation.Alert.init(title:secondaryButton:secondaryButtonBehavior:)`
    # was added in 26.1. iOS 26.0 only has the deprecated four-arg init
    # `init(title:stopButton:secondaryButton:secondaryButtonBehavior:)`
    # which we intentionally don't use. Dropping 26.0 is fine — adoption
    # has moved to 26.1+ by April 2026 and the build fails on 26.0 anyway.
    iOS: "26.1"
settings:
  SWIFT_VERSION: "6.0"
# Swift Package Manager dependencies resolved at build time by Xcode.
# Keep this list minimal — every added package slows cold builds.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.36.0
targets:
  AffirmationAlarm:
    type: application
    platform: iOS
    sources:
      - path: AffirmationAlarm
        excludes:
          - Preview Content
          - "**/*.example"
          - Info.generated.plist
          - Resources/Sounds/WakeUpSongs
      - path: AffirmationAlarm/Resources/Sounds/WakeUpSongs
        type: folder
    dependencies:
      - package: Sentry
        product: Sentry
      - target: AlarmLiveActivity
    info:
      path: AffirmationAlarm/Info.generated.plist
      properties:
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        NSAlarmKitUsageDescription: "Affirmation Alarm uses the system alarm framework so your morning ritual rings reliably and wakes you on time, even in silent mode."
        # Required for the AlarmLiveActivity widget extension to render
        # custom UI on the lock screen / Dynamic Island when alarms fire.
        NSSupportsLiveActivities: true
        # Required for AlarmAudioPlayer to maintain an AVAudioSession
        # in the background for affirmation playback + wake-up songs.
        # Without this, AVAudioSession.setActive(true) fails when the
        # app is backgrounded.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Fonts/Sora-Regular.ttf
          - Fonts/Sora-Medium.ttf
          - Fonts/Sora-SemiBold.ttf
          - Fonts/Sora-Bold.ttf
          - Fonts/DMSans-Light.ttf
          - Fonts/DMSans-Regular.ttf
          - Fonts/DMSans-Medium.ttf
          - Fonts/DMSans-SemiBold.ttf
          - Fonts/DMSans-Bold.ttf
        # Branded launch screen: dark charcoal-plum background matching
        # the app's `.sunrise` gradient end-state, so first launch doesn't
        # flash a jarring white screen into the dark home UI. The
        # `LaunchBackground` color set lives in Assets.xcassets.
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cgibson.affirmationalarm
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "2"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: JLYXS97L8A
      GENERATE_INFOPLIST_FILE: YES
      # When the CI build forces CODE_SIGN_STYLE=Manual on the command
      # line, xcodebuild requires a provisioning profile *per target*.
      # We can't put a single specifier on the command line because that
      # would apply globally to both targets in the scheme. Instead the
      # main app's specifier reads from a custom build setting
      # `APP_PROVISIONING_PROFILE` that codemagic.yaml's archive step
      # sets to the resolved profile name; the widget extension below
      # uses `WIDGET_PROVISIONING_PROFILE`. Local Xcode builds use
      # automatic signing and ignore these.
      PROVISIONING_PROFILE_SPECIFIER: "$(APP_PROVISIONING_PROFILE)"
      # INFOPLIST_KEY_* build settings below duplicate values in
      # `info.properties` above. Kept in sync because some CI paths pass
      # them on the command line and would silently drop the `info.properties`
      # entries otherwise. Do not remove without also removing the
      # command-line overrides in `codemagic.yaml`.
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  AlarmLiveActivity:
    # Widget Extension that renders the Live Activity for AlarmKit alarms
    # on the lock screen + Dynamic Island. The main app target depends on
    # this target and embeds it as an extension. Shares the
    # `AffirmationAlarmMetadata.swift` source file via the explicit
    # `sources` list below — no shared framework needed since the
    # metadata is tiny. The widget intentionally does NOT contain the
    # Stop/Snooze intents: AlarmKit's system alert (rendered separately
    # from this Live Activity) handles those via the configuration's
    # `stopIntent` and `secondaryIntent`.
    type: app-extension
    platform: iOS
    sources:
      - path: AlarmLiveActivity
      - path: AffirmationAlarm/Models/AffirmationAlarmMetadata.swift
      - path: AffirmationAlarm/Models/RingingAttributes.swift
    info:
      path: AlarmLiveActivity/Info.generated.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cgibson.affirmationalarm.AlarmLiveActivity
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: JLYXS97L8A
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: "Alarm"
      INFOPLIST_KEY_NSHumanReadableCopyright: ""
      SKIP_INSTALL: NO
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      # CI sets WIDGET_PROVISIONING_PROFILE on the xcodebuild command
      # line; this expands to that name when CODE_SIGN_STYLE=Manual is
      # forced. See the comment on the main app target.
      PROVISIONING_PROFILE_SPECIFIER: "$(WIDGET_PROVISIONING_PROFILE)"

  AffirmationAlarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AffirmationAlarmTests
    dependencies:
      - target: AffirmationAlarm
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cgibson.affirmationalarm.tests
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: JLYXS97L8A
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AffirmationAlarm.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AffirmationAlarm"
      BUNDLE_LOADER: "$(TEST_HOST)"
