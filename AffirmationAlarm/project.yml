name: AffirmationAlarm
options:
  bundleIdPrefix: com.cgibson
  deploymentTarget:
    # iOS 26.1 is required — `AlarmPresentation.Alert.init(title:secondaryButton:secondaryButtonBehavior:)`
    # was added in 26.1. iOS 26.0 only has the deprecated four-arg init
    # `init(title:stopButton:secondaryButton:secondaryButtonBehavior:)`
    # which we intentionally don't use. Dropping 26.0 is fine — adoption
    # has moved to 26.1+ by April 2026 and the build fails on 26.0 anyway.
    iOS: "26.1"
settings:
  SWIFT_VERSION: "6.0"
# Swift Package Manager dependencies resolved at build time by Xcode.
# Keep this list minimal — every added package slows cold builds.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.36.0
targets:
  AffirmationAlarm:
    type: application
    platform: iOS
    sources:
      - path: AffirmationAlarm
        excludes:
          - Preview Content
          - "**/*.example"
          - Info.generated.plist
    dependencies:
      - package: Sentry
        product: Sentry
    info:
      path: AffirmationAlarm/Info.generated.plist
      properties:
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        NSAlarmKitUsageDescription: "Affirmation Alarm uses the system alarm framework so your morning ritual rings reliably and wakes you on time, even in silent mode."
        # Required for StopAndPlayClosingIntent to activate an
        # AVAudioSession and play `closing-<alarmID>.wav` while the app
        # is in the background after the user taps Stop on the alarm.
        # Without this, AVAudioSession.setActive(true) fails and the
        # closing statement is silently swallowed.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Fonts/Sora-Regular.ttf
          - Fonts/Sora-Medium.ttf
          - Fonts/Sora-SemiBold.ttf
          - Fonts/Sora-Bold.ttf
          - Fonts/DMSans-Light.ttf
          - Fonts/DMSans-Regular.ttf
          - Fonts/DMSans-Medium.ttf
          - Fonts/DMSans-SemiBold.ttf
          - Fonts/DMSans-Bold.ttf
        # Branded launch screen: dark charcoal-plum background matching
        # the app's `.sunrise` gradient end-state, so first launch doesn't
        # flash a jarring white screen into the dark home UI. The
        # `LaunchBackground` color set lives in Assets.xcassets.
        UILaunchScreen:
          UIColorName: "LaunchBackground"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cgibson.affirmationalarm
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "2"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: JLYXS97L8A
      GENERATE_INFOPLIST_FILE: YES
      # INFOPLIST_KEY_* build settings below duplicate values in
      # `info.properties` above. Kept in sync because some CI paths pass
      # them on the command line and would silently drop the `info.properties`
      # entries otherwise. Do not remove without also removing the
      # command-line overrides in `codemagic.yaml`.
      INFOPLIST_KEY_CFBundleIconName: AppIcon
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  AffirmationAlarmTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AffirmationAlarmTests
    dependencies:
      - target: AffirmationAlarm
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.cgibson.affirmationalarm.tests
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: JLYXS97L8A
      GENERATE_INFOPLIST_FILE: YES
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AffirmationAlarm.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AffirmationAlarm"
      BUNDLE_LOADER: "$(TEST_HOST)"
