workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.4
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: claude/*
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd AffirmationAlarm
          xcodegen generate
      - name: Build for Simulator
        script: |
          set -o pipefail
          cd AffirmationAlarm
          xcodebuild build \
            -project AffirmationAlarm.xcodeproj \
            -scheme AffirmationAlarm \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      - name: Run Tests
        script: |
          cd AffirmationAlarm
          xcodebuild test \
            -project AffirmationAlarm.xcodeproj \
            -scheme AffirmationAlarm \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 || echo "No tests found or tests failed"
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # ============================================================
  # TestFlight Workflow
  # ============================================================
  # BEFORE THIS WORKS, you must complete these steps:
  #
  # 1. Apple Developer Account — must be active
  #
  # 2. App Store Connect — create your app:
  #    - Go to appstoreconnect.apple.com → My Apps → + → New App
  #    - Bundle ID: com.cgibson.affirmationalarm
  #
  # 3. App Store Connect API Key:
  #    - Go to appstoreconnect.apple.com/access/api
  #    - Create a new key with "App Manager" role
  #    - Save the Issuer ID, Key ID, and download the .p8 file
  #
  # 4. Codemagic Dashboard Setup:
  #    - Go to your app settings in codemagic.io
  #    - Under Environment Variables, add:
  #      APP_STORE_CONNECT_ISSUER_ID  (from step 3)
  #      APP_STORE_CONNECT_KEY_IDENTIFIER  (Key ID from step 3)
  #      APP_STORE_CONNECT_PRIVATE_KEY  (contents of .p8 file)
  #      CERTIFICATE_PRIVATE_KEY  (your code signing private key)
  #    - Mark all as "Secure" so they're encrypted
  # ============================================================
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      xcode: 16.4
      groups:
        - appstore_credentials
      vars:
        BUNDLE_ID: "com.cgibson.affirmationalarm"
        XCODE_SCHEME: "AffirmationAlarm"
        XCODE_PROJECT: "AffirmationAlarm.xcodeproj"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/ios-app-development-faMqt
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd AffirmationAlarm
          xcodegen generate
      - name: Set up API key for signing
        script: |
          # Write the App Store Connect API key for xcodebuild auto-signing
          # The integration sets APP_STORE_CONNECT_PRIVATE_KEY (may be @file: ref or raw)
          if echo "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q '@file:'; then
            KEY_PATH=$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | sed 's/@file://')
            cp "$KEY_PATH" /tmp/AuthKey.p8
          else
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" | perl -pe 's/\\n/\n/g' > /tmp/AuthKey.p8
          fi
          chmod 600 /tmp/AuthKey.p8
          echo "API key written ($(wc -l < /tmp/AuthKey.p8) lines)"
          head -1 /tmp/AuthKey.p8
          tail -1 /tmp/AuthKey.p8
      - name: Increment build number
        script: |
          cd AffirmationAlarm
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo 0) + 1))
      - name: Build archive
        script: |
          cd AffirmationAlarm
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/AffirmationAlarm.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEVELOPMENT_TEAM=JLYXS97L8A
      - name: Export IPA
        script: |
          cd AffirmationAlarm
          cat > /tmp/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>JLYXS97L8A</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/AffirmationAlarm.xcarchive \
            -exportPath build \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath /tmp/AuthKey.p8 \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID"
    artifacts:
      - AffirmationAlarm/build/AffirmationAlarm.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
