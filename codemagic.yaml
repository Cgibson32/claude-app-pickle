# ────────────────────────────────────────────────────────────────────────────────
# PicklePro — Codemagic Cloud Build Configuration
#
# Codemagic (codemagic.io) is often the easiest cloud build option for
# developers without a Mac. It handles code signing automatically via
# their dashboard UI.
#
# ─── SETUP ──────────────────────────────────────────────────────────────────────
#
# 1. Sign up at https://codemagic.io (free tier: 500 build mins/mo)
# 2. Connect your GitHub repository
# 3. In Codemagic dashboard → Code signing → iOS:
#    - Upload your .p12 certificate + password
#    - Upload your provisioning profile (.mobileprovision)
#    - Or use Codemagic's automatic code signing (recommended — they manage
#      certificates for you using your Apple Developer credentials)
# 4. Under Distribution → App Store Connect:
#    - Add your App Store Connect API key (.p8 file)
#    - Enter the Key ID and Issuer ID
# 5. Push to main or trigger manually.
#
# ────────────────────────────────────────────────────────────────────────────────

workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.picklepro.app
      node: 20
      xcode: latest

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Build web assets
        script: npm run build

      - name: Add iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Set bundle version
        script: |
          # Extract version from tag (e.g., v1.2.3 → 1.2.3)
          VERSION=${CM_TAG#v}
          BUILD_NUMBER=$((CM_BUILD_NUMBER))

          cd ios/App/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" Info.plist

      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild build -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            clean build | xcpretty

      - name: Build IPA
        script: |
          cd ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/PicklePro.xcarchive

          xcodebuild -exportArchive \
            -archivePath build/PicklePro.xcarchive \
            -exportOptionsPlist ../../ios-export-options.plist \
            -exportPath build/export

    artifacts:
      - ios/App/build/export/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Uncomment when ready for production:
        # submit_to_app_store: true
