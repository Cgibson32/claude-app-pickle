workflows:
  ios-simulator-build:
    name: iOS Simulator Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        - pattern: claude/*
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate Xcode project
        script: |
          cd AffirmationAlarm
          xcodegen generate
      - name: Build for Simulator
        script: |
          set -o pipefail
          cd AffirmationAlarm
          xcodebuild build \
            -project AffirmationAlarm.xcodeproj \
            -scheme AffirmationAlarm \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
      - name: Run Tests
        script: |
          cd AffirmationAlarm
          xcodebuild test \
            -project AffirmationAlarm.xcodeproj \
            -scheme AffirmationAlarm \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 || echo "No tests found or tests failed"
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log

  # ============================================================
  # TestFlight Workflow
  # ============================================================
  # BEFORE THIS WORKS, you must complete these steps:
  #
  # 1. Apple Developer Account — must be active
  #
  # 2. App Store Connect — create your app:
  #    - Go to appstoreconnect.apple.com → My Apps → + → New App
  #    - Bundle ID: com.cgibson.affirmationalarm
  #
  # 3. App Store Connect API Key:
  #    - Go to appstoreconnect.apple.com/access/api
  #    - Create a new key with "App Manager" role
  #    - Save the Issuer ID, Key ID, and download the .p8 file
  #
  # 4. Codemagic Dashboard Setup:
  #    Go to codemagic.io → your app → Environment variables.
  #    Create a variable group named EXACTLY `app_secrets` and add each
  #    of the following inside it, marked "Secure":
  #      OPENAI_API_KEY      (for Nova-voice TTS rendering)
  #      ANTHROPIC_API_KEY   (for affirmation generation)
  #      SENTRY_DSN          (optional — crash reporting)
  #    The workflow below references this group by name — if you use a
  #    different name, update the `groups:` block in ios-testflight.
  #    App Store Connect auth is handled by the `integrations` block in
  #    the workflow, so you do NOT need to add
  #    APP_STORE_CONNECT_ISSUER_ID / KEY_IDENTIFIER / PRIVATE_KEY manually
  #    if you've wired up the Codemagic CI integration in the dashboard.
  #
  # If OPENAI_API_KEY is missing, the app builds successfully but cannot
  # render any personalized audio at runtime. Alarms will fire with the
  # bundled tone and the `AlarmAudioPlayer` fallback paths hit `noFiles`
  # because no MP3s were ever synthesized. The "Inject secrets" step
  # below prints the length of each value so you can spot a missing key
  # in the build log.
  # ============================================================
  ios-testflight:
    name: iOS TestFlight Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI
    environment:
      xcode: latest
      # Env vars come from the `app_secrets` variable group in the
      # Codemagic dashboard. Required keys in that group:
      #   OPENAI_API_KEY      — Nova-voice TTS
      #   ANTHROPIC_API_KEY   — affirmation generation
      # Optional:
      #   SENTRY_DSN          — crash reporting
      # All must be marked Secure. App Store Connect auth comes from the
      # `integrations` block above (Codemagic CI integration), not env vars.
      groups:
        - app_secrets
      vars:
        BUNDLE_ID: "com.cgibson.affirmationalarm"
        XCODE_SCHEME: "AffirmationAlarm"
        XCODE_PROJECT: "AffirmationAlarm.xcodeproj"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: claude/ios-app-development-faMqt
          include: true
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen
      - name: Generate app icons
        script: |
          cd AffirmationAlarm/AffirmationAlarm/Assets.xcassets/AppIcon.appiconset
          SOURCE="AppIcon.png"
          # Generate all required icon sizes from 1024x1024 source
          for SIZE in 20 29 40 58 60 76 80 87 120 152 167 180; do
            sips -z $SIZE $SIZE "$SOURCE" --out "icon_${SIZE}.png" >/dev/null
          done
          # Modern asset catalog requires a 1024x1024 'Any Appearance' image
          # well — referenced by Contents.json. Master AppIcon.png may be
          # larger (we ship at 2048x2048 for fidelity), so resize down.
          sips -z 1024 1024 "$SOURCE" --out Icon-1024.png >/dev/null
          # Map to filenames expected by Contents.json
          cp icon_40.png  Icon-20@2x.png
          cp icon_60.png  Icon-20@3x.png
          cp icon_58.png  Icon-29@2x.png
          cp icon_87.png  Icon-29@3x.png
          cp icon_80.png  Icon-40@2x.png
          cp icon_120.png Icon-40@3x.png
          cp icon_120.png Icon-60@2x.png
          cp icon_180.png Icon-60@3x.png
          cp icon_20.png  Icon-20-ipad.png
          cp icon_40.png  Icon-20@2x-ipad.png
          cp icon_29.png  Icon-29-ipad.png
          cp icon_58.png  Icon-29@2x-ipad.png
          cp icon_40.png  Icon-40-ipad.png
          cp icon_80.png  Icon-40@2x-ipad.png
          cp icon_76.png  Icon-76.png
          cp icon_152.png Icon-76@2x.png
          cp icon_167.png Icon-83.5@2x.png
          # Clean up temp files
          rm -f icon_*.png
          echo "Generated $(ls Icon-*.png | wc -l) icon files"
      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "1")
          BUILD_NUMBER=$(($LATEST + 1))
          if [ "$BUILD_NUMBER" -le 1 ]; then
            BUILD_NUMBER=$(date +%s)
          fi
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
          echo "Latest: $LATEST, New build number: $BUILD_NUMBER"
          # Update project.yml with the new build number before xcodegen
          cd AffirmationAlarm
          sed -i.bak "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD_NUMBER\"/" project.yml
          echo "Updated project.yml CURRENT_PROJECT_VERSION to $BUILD_NUMBER"
      - name: Generate Xcode project
        script: |
          cd AffirmationAlarm
          xcodegen generate
          # Verify build number in generated plist
          echo "=== CFBundleVersion in generated plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" AffirmationAlarm/Info.generated.plist 2>&1 || echo "Not found"
          echo "=== Icon files in appiconset ==="
          ls -la AffirmationAlarm/Assets.xcassets/AppIcon.appiconset/ | head -10
      - name: Inject secrets into Info.plist
        script: |
          # Write API keys and Sentry DSN into the xcodegen-generated
          # Info.plist so the runtime `Bundle.main.object(forInfoDictionaryKey:)`
          # calls in APIKeyConfiguration.swift and AppDelegate.configureSentryIfAvailable()
          # can find them. Each secret is set from an env var in the
          # `appstore_credentials` group; if the var isn't set, the key is
          # written as an empty string and the runtime nil-checks fall
          # through to either a keychain lookup or (for Sentry) a no-op.
          #
          # We report the VALUE LENGTH for each key so a missing/empty
          # secret shows up as "EMPTY" in the build log rather than the
          # previously-misleading "present". Don't echo the value itself.
          cd AffirmationAlarm
          PLIST=AffirmationAlarm/Info.generated.plist
          MISSING_CRITICAL=0
          for KEY in ANTHROPIC_API_KEY OPENAI_API_KEY ELEVENLABS_API_KEY SENTRY_DSN; do
            VALUE="${!KEY:-}"
            # PlistBuddy Add fails if the key exists; Set fails if missing.
            # Try Add first; if it fails, fall back to Set.
            /usr/libexec/PlistBuddy -c "Add :$KEY string $VALUE" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$KEY $VALUE" "$PLIST"
            if [ -n "$VALUE" ]; then
              echo "  $KEY: present (${#VALUE} chars)"
            else
              echo "  $KEY: !!! EMPTY !!! runtime will fall back (no value in Codemagic env)"
              # OPENAI and ANTHROPIC keys are critical for the affirmation
              # rendering pipeline. An empty string here silently disables
              # every TTS call and the app ships with no audio. Don't fail
              # the build (allows CI of UI-only changes), but flag loudly.
              if [ "$KEY" = "ELEVENLABS_API_KEY" ] || [ "$KEY" = "ANTHROPIC_API_KEY" ]; then
                MISSING_CRITICAL=$((MISSING_CRITICAL + 1))
              fi
            fi
          done
          if [ "$MISSING_CRITICAL" -gt 0 ]; then
            echo ""
            echo "========================================================"
            echo "WARNING: $MISSING_CRITICAL critical API key(s) are empty."
            echo "The built app will NOT render personalized affirmations."
            echo "Add them to codemagic.io → Environment variables →"
            echo "  appstore_credentials group, marked as Secure."
            echo "========================================================"
            echo ""
          fi
      - name: Set up API key
        script: |
          # Write the App Store Connect API key to a file
          # The integration sets APP_STORE_CONNECT_PRIVATE_KEY (may be @file: ref or raw)
          if echo "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q '@file:'; then
            KEY_PATH=$(echo "$APP_STORE_CONNECT_PRIVATE_KEY" | sed 's/@file://')
            cp "$KEY_PATH" /tmp/AuthKey.p8
          else
            echo "$APP_STORE_CONNECT_PRIVATE_KEY" | perl -pe 's/\\n/\n/g' > /tmp/AuthKey.p8
          fi
          chmod 600 /tmp/AuthKey.p8
          echo "API key written ($(wc -l < /tmp/AuthKey.p8) lines)"
      - name: Revoke stale certificates
        script: |
          # Previous CI builds created certificates with ephemeral keys that are now lost.
          # Apple has a certificate limit, so we must revoke stale ones before creating fresh ones.
          python3 <<'PYEOF'
          import json, time, os, base64
          from urllib.request import Request, urlopen
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils

          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b'=').decode()

          # Load API key
          with open('/tmp/AuthKey.p8', 'rb') as f:
              key = serialization.load_pem_private_key(f.read(), password=None)

          # Build JWT
          hdr = b64url(json.dumps({"alg":"ES256","kid":os.environ['APP_STORE_CONNECT_KEY_IDENTIFIER'],"typ":"JWT"}).encode())
          now = int(time.time())
          pay = b64url(json.dumps({"iss":os.environ['APP_STORE_CONNECT_ISSUER_ID'],"iat":now,"exp":now+1200,"aud":"appstoreconnect-v1"}).encode())
          sig_der = key.sign(f"{hdr}.{pay}".encode(), ec.ECDSA(hashes.SHA256()))
          r, s = utils.decode_dss_signature(sig_der)
          token = f"{hdr}.{pay}.{b64url(r.to_bytes(32,'big')+s.to_bytes(32,'big'))}"

          headers = {'Authorization': f'Bearer {token}'}

          # List all certificates
          req = Request('https://api.appstoreconnect.apple.com/v1/certificates', headers=headers)
          data = json.loads(urlopen(req).read())

          count = 0
          for cert in data.get('data', []):
              cid = cert['id']
              ctype = cert['attributes']['certificateType']
              cname = cert['attributes'].get('displayName', 'unknown')
              print(f"Revoking {ctype}: {cname} ({cid})")
              try:
                  urlopen(Request(f'https://api.appstoreconnect.apple.com/v1/certificates/{cid}', headers=headers, method='DELETE'))
                  count += 1
                  print(f"  Done")
              except Exception as e:
                  print(f"  Failed: {e}")
          print(f"Revoked {count} certificates")
          PYEOF
      - name: Set up code signing
        script: |
          keychain initialize
          # Generate a fresh certificate key
          openssl genrsa 2048 2>/dev/null > /tmp/cert_key.pem
          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
          # Fetch/create distribution cert + provisioning profile
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          # Find the provisioning profile (Codemagic CLI saves to Xcode UserData)
          PROFILE_PATH=$(ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PROFILE_PATH" ]; then
            echo "ERROR: No provisioning profiles found"
            ls -laR ~/Library/Developer/Xcode/UserData/ || true
            ls -laR ~/Library/MobileDevice/ || true
            exit 1
          fi
          # Copy to where xcodebuild expects it for manual signing
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin \
            <<< "$(/usr/bin/security cms -D -i "$PROFILE_PATH")")
          # Extract profile name for export step
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin \
            <<< "$(/usr/bin/security cms -D -i "$PROFILE_PATH")")
          echo "PROFILE_UUID=$PROFILE_UUID" >> $CM_ENV
          echo "PROFILE_NAME=$PROFILE_NAME" >> $CM_ENV
          echo "Using profile: $PROFILE_NAME ($PROFILE_UUID)"
      - name: Build archive
        script: |
          cd AffirmationAlarm
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath build/AffirmationAlarm.xcarchive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM=JLYXS97L8A \
            GENERATE_INFOPLIST_FILE=YES \
            INFOPLIST_KEY_CFBundleIconName=AppIcon \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
      - name: Export IPA
        script: |
          cd AffirmationAlarm
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>JLYXS97L8A</string>
            <key>uploadSymbols</key>
            <true/>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.cgibson.affirmationalarm</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/AffirmationAlarm.xcarchive \
            -exportPath build \
            -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - AffirmationAlarm/build/AffirmationAlarm.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
